name: calls

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate corpus and check the index is current
        run: python tools/build_calls.py --check

      - name: Run the test suite
        run: python -m unittest discover -s tools -p "test_*.py" -v

  # Layer 2: a server author runs the harness in their own CI to check
  # that the calls this repo documents for their server still work.
  #
  # The pattern is the distribution mechanism: every server that runs this
  # job contributes a verified corpus, and the corpus grows without anyone
  # having to write anything down.
  #
  # Copy this block into your own repo to use it:
  #
  #   - run: python -m pip install pyyaml
  #   - run: |
  #       python tools/harness.py --server my-server \
  #         --cmd "node ./dist/index.js" \
  #         --out calls.yaml --report harness-report.json
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pyyaml

      - name: Probe the reference server and build a corpus
        run: |
          python tools/harness.py \
            --server rea \
            --cmd "node ${{ env.REA_DIR }}/scripts/rea.mjs mcp" \
            --out /tmp/generated.yaml \
            --report /tmp/harness-report.json

      - name: The generated corpus must pass the validator
        run: |
          python tools/build_calls.py --check \
            --corpus /tmp/generated.yaml \
            --no-index-check

      - name: Upload the generated corpus and report
        uses: actions/upload-artifact@v4
        with:
          name: verified-calls
          path: |
            /tmp/generated.yaml
            /tmp/harness-report.json

  # Layer 3: re-execute the recorded calls against the live server and
  # prove the evidence is still true.
  #
  # This is the layer that catches FORGED evidence. The static gate can
  # only prove evidence is present; only a replay can prove it is real.
  replay:
    runs-on: [self-hosted, mcp-replay]
    if: ${{ github.repository_owner == '<you>' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - name: Replay every recorded call against the live server
        run: |
          python tools/verify_replay.py \
            --server rea \
            --cmd "node ${{ env.REA_DIR }}/scripts/rea.mjs mcp"
